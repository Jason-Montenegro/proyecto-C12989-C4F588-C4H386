name: hurry-to-the-top

services:
  frontend:
    container_name: httt-frontend
    pull_policy: never
    image: httt-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 8081:8081
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - httt-frontend-node-modules:/app/node_modules
      - httt-frontend-nextjs:/app/.next

  backend:
    container_name: httt-backend
    pull_policy: never
    image: httt-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8082:8082
    env_file:
      - ./backend/.env
    environment:
      - PORT=8082
    volumes:
      - ./backend:/app
      - httt-backend-node-modules:/app/node_modules

volumes:
  httt-frontend-node-modules:
  httt-frontend-nextjs:
  httt-backend-node-modules:
