<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es" xml:lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrarse - Hurry to the Top</title>
    <link rel="icon" href="./public/icon.svg" type="image/svg+xml" />
  </head>

  <body>
    <main>
      <img src="./public/icon.svg" alt="Hurry to the Top Logo" width="300" />

      <form action="#" method="post">
        <div>
          <label>
            Usuario
            <input type="text" name="username" autocomplete="username" required="required" />
          </label>
        </div>
        <div>
          <label>
            Correo electrónico
            <input type="email" name="email" autocomplete="email" required="required" />
          </label>
        </div>
        <div>
          <label>
            Contraseña
            <input type="password" name="password" autocomplete="new-password" required="required" />
          </label>
        </div>
        <div>
          <label>
            Confirmar contraseña
            <input type="password" name="confirm-password" autocomplete="new-password" required="required" />
          </label>
        </div>

        <button type="submit">Registrarse</button>
      </form>
    </main>
  </body>
</html>
