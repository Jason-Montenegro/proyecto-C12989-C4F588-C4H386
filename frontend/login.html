<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="es" xml:lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión - Hurry to the Top</title>
    <link rel="icon" href="./public/icon.svg" type="image/svg+xml" />
  </head>

  <body>
    <main>
      <img src="./public/icon.svg" alt="Hurry to the Top Logo" width="300" />

      <form action="#" method="post">
        <div>
          <label>
            Usuario
            <input type="text" name="username" autocomplete="username" required="required" />
          </label>
        </div>
        <div>
          <label>
            Contraseña
            <input type="password" name="password" autocomplete="current-password" required="required" />
          </label>
        </div>

        <nav>
          <ul>
            <li><a href="./register.html">¿No te has registrado?</a></li>
            <li><a href="#">¿Olvidaste tu contraseña?</a></li>
          </ul>
        </nav>

        <button type="submit">Ingresar</button>
      </form>
    </main>
  </body>
</html>
